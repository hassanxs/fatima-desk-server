# Fatima Desk: build the server binaries (hbbs, hbbr) for the VPS.
#
# Run from GitHub: Actions -> "Fatima Desk server build" -> Run workflow.
# Same build as upstream's build.yaml (static musl binaries via cross), for
# x86_64 only. The binaries go into deploy/server-image/ on the VPS, where a
# FROM scratch image (like rustdesk/rustdesk-server) is built from them.
name: Fatima Desk server build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.90"
          targets: x86_64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Test (Fatima Desk ID and alias rules)
        run: |
          cargo test --release --lib fatimadesk_id_tests
          cargo test --release --lib fd_alias_tests

      - name: Build hbbs and hbbr
        run: cross build --release --target x86_64-unknown-linux-musl --bin hbbs --bin hbbr

      - name: Check binaries
        run: |
          cd target/x86_64-unknown-linux-musl/release
          chmod a+x hbbs hbbr
          file hbbs hbbr
          ./hbbs --version || true

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fatimadesk-server-linux-x86_64
          path: |
            target/x86_64-unknown-linux-musl/release/hbbs
            target/x86_64-unknown-linux-musl/release/hbbr
          if-no-files-found: error
          retention-days: 7
